<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montador de XML – NF-e</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--mut:#5d6b7c;--line:#d9dee5;--ac:#2457d6;--ok:#1d7a5f;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#18202a;--ink:#e6ebf1;--mut:#9aa8b8;--line:#2b3644;--ac:#7aa2ff;--ok:#4cc29d;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:28px 0 10px}
.sub{margin:0 0 20px;color:var(--mut)}
#drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;background:var(--card);cursor:pointer}
#drop.on,#drop:focus-visible{border-color:var(--ac);outline:none}
#msg{min-height:22px;margin:10px 0;color:var(--mut)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mut);font-size:13px}
tr:last-child td{border-bottom:0}
.n{text-align:right}
button{font:inherit;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--ac)}
button.ok{border-color:var(--ok);color:var(--ok)}
button.bad{border-color:var(--bad);color:var(--bad)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.empty{padding:20px;color:var(--mut)}
#total{margin-top:10px;font-weight:600;text-align:right}
</style>
</head>
<body>
<main>
<h1>Montador de XML</h1>
<p class="sub">Descartar aqui não avisa a SEFAZ. O Desconhecimento continua sendo registrado no ERP.</p>

<div id="drop" tabindex="0" role="button">Arraste os XMLs aqui ou clique para escolher</div>
<input id="arq" type="file" accept=".xml" multiple hidden>
<div id="msg" role="status"></div>

<h2>Notas</h2>
<div class="wrap"><table>
<thead><tr><th>Emitente</th><th>Nº</th><th>Emissão</th><th class="n">Total</th><th>Parcelas</th><th>Status</th><th>Ações</th></tr></thead>
<tbody id="notas"></tbody></table></div>

<h2>Vencimentos das notas aceitas</h2>
<div class="wrap"><table>
<thead><tr><th>Vencimento</th><th>Emitente</th><th>Parcela</th><th class="n">Valor</th></tr></thead>
<tbody id="venc"></tbody></table></div>
<div id="total"></div>
</main>

<script>
const KEY = 'montador-nfe-v1';
let notas = {};
try { notas = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { notas = {}; }
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify(notas)); } catch (e) {} };

const $ = id => document.getElementById(id);
const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dta = iso => iso ? iso.slice(0, 10).split('-').reverse().join('/') : '—';
const tx = (el, tag) => { const n = el && el.getElementsByTagNameNS('*', tag)[0]; return n ? n.textContent.trim() : ''; };
function el(t, p = {}, ...k) { const e = document.createElement(t); Object.assign(e, p); e.append(...k); return e; }

// Lê um XML de NF-e (completo ou resumo) e devolve os dados que importam.
function ler(texto) {
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('XML inválido');
  const inf = doc.getElementsByTagNameNS('*', 'infNFe')[0];
  if (inf) {
    const emit = doc.getElementsByTagNameNS('*', 'emit')[0];
    const parcelas = [...doc.getElementsByTagNameNS('*', 'dup')].map(d => ({
      n: tx(d, 'nDup'), venc: tx(d, 'dVenc'), valor: parseFloat(tx(d, 'vDup')) || 0
    }));
    return {
      chave: (inf.getAttribute('Id') || '').replace('NFe', ''), tipo: 'completa',
      emitente: tx(emit, 'xNome'), cnpj: tx(emit, 'CNPJ'), numero: tx(doc, 'nNF'),
      emissao: tx(doc, 'dhEmi').slice(0, 10), total: parseFloat(tx(doc, 'vNF')) || 0, parcelas
    };
  }
  const res = doc.getElementsByTagNameNS('*', 'resNFe')[0];
  if (res) return {
    chave: tx(res, 'chNFe'), tipo: 'resumo', emitente: tx(res, 'xNome'), cnpj: tx(res, 'CNPJ'),
    numero: '', emissao: tx(res, 'dhEmi').slice(0, 10), total: parseFloat(tx(res, 'vNF')) || 0, parcelas: []
  };
  throw new Error('não é uma NF-e');
}

async function importar(files) {
  let novas = 0, ign = 0, atu = 0; const erros = [];
  for (const f of files) {
    try {
      const n = ler(await f.text());
      if (n.chave.length !== 44) throw new Error('chave inválida');
      const ex = notas[n.chave];
      if (!ex) { n.status = 'pendente'; notas[n.chave] = n; novas++; }
      else if (ex.tipo === 'resumo' && n.tipo === 'completa') { n.status = ex.status; notas[n.chave] = n; atu++; }
      else ign++;
    } catch (e) { erros.push(f.name + ': ' + e.message); }
  }
  salvar(); desenhar();
  $('msg').textContent = `${novas} nova(s), ${atu} atualizada(s), ${ign} repetida(s) ignorada(s)` +
    (erros.length ? ` | com erro: ${erros.join('; ')}` : '');
}

function mudar(chave, status) { notas[chave].status = status; salvar(); desenhar(); }

function desenhar() {
  const lista = Object.values(notas).sort((a, b) => b.emissao.localeCompare(a.emissao));
  const tb = $('notas'); tb.replaceChildren();
  if (!lista.length) tb.append(el('tr', {}, el('td', { colSpan: 7, className: 'empty' }, 'Nenhuma nota ainda. Arraste os XMLs para cima.')));
  for (const n of lista) {
    const acoes = el('td');
    if (n.status === 'aceita') {
      acoes.append(el('button', { textContent: 'Remover do calendário', onclick: () => mudar(n.chave, 'pendente') }));
    } else {
      if (n.parcelas.length) acoes.append(el('button', { className: 'ok', textContent: 'Aceitar', onclick: () => mudar(n.chave, 'aceita') }), ' ');
      const volta = n.status === 'descartada';
      acoes.append(el('button', { className: 'bad', textContent: volta ? 'Voltar para pendente' : 'Descartar', onclick: () => mudar(n.chave, volta ? 'pendente' : 'descartada') }));
    }
    const parc = n.tipo === 'resumo' ? 'só resumo' : (n.parcelas.length ? n.parcelas.length + 'x' : 'sem duplicata');
    tb.append(el('tr', {},
      el('td', { textContent: n.emitente }), el('td', { textContent: n.numero || '—' }),
      el('td', { textContent: dta(n.emissao) }), el('td', { className: 'n', textContent: brl(n.total) }),
      el('td', { textContent: parc }), el('td', {}, el('span', { className: 'tag', textContent: n.status })), acoes));
  }
  const venc = [];
  for (const n of lista) if (n.status === 'aceita')
    n.parcelas.forEach((p, i) => venc.push({ ...p, emitente: n.emitente, k: `${i + 1}/${n.parcelas.length}` }));
  venc.sort((a, b) => a.venc.localeCompare(b.venc));
  const vb = $('venc'); vb.replaceChildren();
  if (!venc.length) vb.append(el('tr', {}, el('td', { colSpan: 4, className: 'empty' }, 'Aceite uma nota para ver os vencimentos aqui.')));
  venc.forEach(v => vb.append(el('tr', {},
    el('td', { textContent: dta(v.venc) }), el('td', { textContent: v.emitente }),
    el('td', { textContent: 'parcela ' + v.k }), el('td', { className: 'n', textContent: brl(v.valor) }))));
  $('total').textContent = venc.length ? 'Total a pagar: ' + brl(venc.reduce((s, v) => s + v.valor, 0)) : '';
}

const drop = $('drop'), arq = $('arq');
drop.onclick = () => arq.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); arq.click(); } };
arq.onchange = () => { importar(arq.files); arq.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); importar(e.dataTransfer.files); };
desenhar();
</script>
</body>
</html>
